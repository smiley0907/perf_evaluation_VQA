# Cell 11: VQA Convergence Analysis

plt.figure(figsize=(9, 6))

for layers, energy_history in vqa_convergence_history.items():

    circuit_depth = circuits[layers].depth()

    plt.plot(
        range(1, len(energy_history) + 1),
        energy_history,
        linewidth=2,
        label=f"Depth {circuit_depth}"
    )

plt.axhline(
    exact_ground_energy,
    linestyle="--",
    linewidth=1.5,
    label="Exact Ground-State Energy"
)

plt.xlabel("VQA Iteration")
plt.ylabel("Energy")
plt.title("VQA Convergence Across Different Circuit Depths")
plt.legend()
plt.grid(True, alpha=0.3)
plt.tight_layout()

plt.savefig(
    "Figure_4_VQA_Convergence.svg",
    format="svg",
    bbox_inches="tight"
)

plt.show()

print("=" * 80)
print("VQA CONVERGENCE ANALYSIS COMPLETED")
print("=" * 80)
print("Figure saved as: Figure_4_VQA_Convergence.svg")
